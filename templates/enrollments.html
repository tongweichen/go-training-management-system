<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生分班</title>
</head>
<body>
    <h1>学生分班</h1>

    <form method="POST">
        <label for="student">选择学生：</label>
        <select id="student" name="student_id" required>
            {% for student in students %}
            <option value="{{ student.id }}">
                {{ student.name }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="class">选择班级：</label>
        <select id="class" name="class_id" required>
            {% for class_item in classes %}
            <option value="{{ class_item.id }}">
                {{ class_item.name }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <button type="submit">确认分班</button>
    </form>

    <p>
        <a href="{{ url_for('home') }}">返回首页</a>
    </p>
</body>
</html>
