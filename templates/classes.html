<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }

        button {
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a252f;
        }

        .enrollment-link {
            display: inline-block;
            background-color: #2c3e50;
            color: white;
            padding: 12px 18px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-decoration: none;
        }

        .enrollment-link:hover {
            background-color: #1a252f;
        }

        .back-link {
            color: #2c3e50;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .class-item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .class-item:last-child {
            border-bottom: none;
        }

        .class-item h3 {
            margin-bottom: 5px;
        }

        .class-item h3 a {
            color: #2c3e50;
            text-decoration: none;
        }

        .class-item h3 a:hover {
            text-decoration: underline;
        }

        .class-item p {
            color: #666;
        }

        .empty-message {
            color: #777;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>班级管理</h1>

        <!-- Student Enrollment Navigation -->
        <a
            class="enrollment-link"
            href="{{ url_for('enrollments') }}"
        >
            添加学生到班级 →
        </a>

        <!-- Create Class -->
        <div class="card">
            <h2>创建班级</h2>

            <form method="POST" action="/classes">

                <label for="name">班级名称：</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="description">班级说明：</label>
                <textarea
                    id="description"
                    name="description"
                    rows="3"
                ></textarea>

                <button type="submit">创建班级</button>
            </form>
        </div>

        <!-- Class List -->
        <div class="card">
            <h2>班级名单</h2>

            {% if classes %}

                {% for class_item in classes %}

                <div class="class-item">
                    <h3>
                        <a href="{{ url_for('class_detail', class_id=class_item.id) }}">
                            {{ class_item.name }}
                        </a>
                    </h3>

                    <p>
                        {{ class_item.description or "暂无班级说明" }}
                    </p>
                </div>

                {% endfor %}

            {% else %}

                <p class="empty-message">
                    暂无班级信息
                </p>

            {% endif %}
        </div>

        <a class="back-link" href="{{ url_for('home') }}">
            ← 返回首页
        </a>

    </div>
</body>
</html>
