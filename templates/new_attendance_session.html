
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建上课场次</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a252f;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2c3e50;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>新建上课场次</h1>

        <div class="card">
            <form method="POST" action="{{ url_for('new_attendance_session') }}">

                <label for="class_id">选择班级：</label>
                <select id="class_id" name="class_id" required>
                    <option value="">请选择班级</option>
                    {% for class_item in classes %}
                    <option value="{{ class_item.id }}">
                        {{ class_item.name }}
                    </option>
                    {% endfor %}
                </select>

                <label for="lesson_date">上课日期：</label>
                <input
                    type="date"
                    id="lesson_date"
                    name="lesson_date"
                    required
                >

                <label for="start_time">开始时间：</label>
                <input
                    type="time"
                    id="start_time"
                    name="start_time"
                    required
                >

                <label for="end_time">结束时间：</label>
                <input
                    type="time"
                    id="end_time"
                    name="end_time"
                    required
                >

                <label for="notes">备注（选填）：</label>
                <textarea
                    id="notes"
                    name="notes"
                    rows="3"
                    placeholder="例如：周末常规课程、临时加课等"
                ></textarea>

                <button type="submit">创建上课场次</button>

            </form>
        </div>

        <a class="back-link" href="{{ url_for('home') }}">
            ← 返回首页
        </a>

    </div>
</body>
</html>
