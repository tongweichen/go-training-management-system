<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑学生信息</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
        }

        button {
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a252f;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>编辑学生信息</h1>

        <div class="card">
            <form method="POST">

                <label for="name">学生姓名：</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ student.name }}"
                    required
                >

                <label for="phone">联系电话：</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ student.phone or '' }}"
                >

                <label for="birthday">出生日期：</label>
                <input
                    type="date"
                    id="birthday"
                    name="birthday"
                    value="{{ student.birthday or '' }}"
                >

                <label for="school">学校：</label>
                <input
                    type="text"
                    id="school"
                    name="school"
                    value="{{ student.school or '' }}"
                >

                <label for="grade">年级：</label>
                <input
                    type="text"
                    id="grade"
                    name="grade"
                    value="{{ student.grade or '' }}"
                    placeholder="例如：三年级"
                >

                <label for="enrollment_date">入学日期：</label>
                <input
                    type="date"
                    id="enrollment_date"
                    name="enrollment_date"
                    value="{{ student.enrollment_date or '' }}"
                >

                <label for="notes">学生备注：</label>
                <textarea
                    id="notes"
                    name="notes"
                    rows="4"
                    placeholder="例如：学习情况、家长要求等"
                >{{ student.notes or '' }}</textarea>

                <button type="submit">保存修改</button>
            </form>
        </div>

        <a class="back-link" href="{{ url_for('students') }}">
            ← 返回学生管理
        </a>
    </div>
</body>
</html>
