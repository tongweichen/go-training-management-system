<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围棋培训管理系统</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .card a:hover {
            background-color: #1a252f;
        }

        .coming-soon {
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>围棋培训管理系统</h1>
        <p>欢迎使用围棋培训管理系统！</p>

        <div class="card-grid">

            <div class="card">
                <h2>学生管理</h2>
                <p>查看和管理学生信息</p>
                <a href="{{ url_for('students') }}">
                    进入学生管理 →
                </a>
            </div>

            <div class="card">
                <h2>班级管理</h2>
                <p>查看班级和课程安排</p>
                <a href="{{ url_for('classes') }}">
                    进入班级管理 →
                </a>
            </div>

            <div class="card">
                <h2>课时管理</h2>
                <p>记录学生的剩余课时</p>
                <p class="coming-soon">功能开发中...</p>
            </div>

        </div>
    </div>
</body>
</html>
